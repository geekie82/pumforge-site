<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Comments — pumTALK</title>
<style>
  :root{
    --bg:#070b16;--panel:#111a2e;--panel2:#0e1626;
    --text:#eef3fb;--dim:#8fa3c0;--faint:#5d7291;
    --accent:#5b9dff;--accent2:#8b6dff;
    --border:#1f2b45;--border2:#2a3a5e;--radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, #14275a 0%, transparent 60%),
      radial-gradient(800px 500px at 0% 0%, #231445 0%, transparent 55%), var(--bg);
    color:var(--text);line-height:1.65}
  nav{position:sticky;top:0;z-index:50;background:rgba(7,11,22,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:800}
  .nav-inner a{color:var(--dim);font-size:.92rem}
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
  .center{text-align:center}
  h1{font-size:2.2rem;margin:0 0 8px;font-weight:800;
    background:linear-gradient(90deg,#fff,#bcd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:1.05rem;max-width:620px;margin:0 auto 30px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:0 14px 44px rgba(0,0,0,.4)}
  .back{display:inline-block;margin-top:26px;color:var(--accent);text-decoration:none;font-weight:600}
  a{color:var(--accent)}
  .footer{color:var(--faint);font-size:.85rem;text-align:center;margin-top:50px;border-top:1px solid var(--border);padding-top:20px}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">◆ pumTALK</div>
    <a href="index.html">← Back to home</a>
  </div>
</nav>

<div class="wrap">
  <div class="center">
    <h1>What people think</h1>
    <p class="sub">Leave a comment, ask a question, or share how you use pumTALK.
    You can comment with your GitHub account — no sign-up beyond that.</p>
  </div>

  <div class="card">
    <!-- Giscus comments (GitHub Discussions) -->
    <div class="giscus"></div>
    <script src="https://giscus.app/client.js"
        data-repo="geekie82/pumtalk-site"
        data-repo-id="1339658105"
        data-category="General"
        data-category-id="DIC_kwDOT9mPec4DDvM-"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="dark"
        data-lang="en"
        crossorigin="anonymous"
        async>
    </script>
  </div>

  <div class="center">
    <a class="back" href="index.html">← Back to pumTALK home</a>
  </div>
</div>

<div class="footer">
  pumTALK · Proprietary software. All rights reserved.
  <br/>Contact: <a href="mailto:simon@pummail.com">simon@pummail.com</a>
</div>
</body>
</html>
