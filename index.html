<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pumFORGE — Your AI. Your machine. Coming soon.</title>
<meta name="description" content="Your AI. Your machine. Coming soon. Not a chatbot — a co-worker. Join the early access list.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0e16; --bg2:#0f1420; --ink:#e8edf7; --dim:#8ea0b8; --cyan:#22d3ee; --line:rgba(255,255,255,.09); }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:radial-gradient(60% 50% at 50% 0%, rgba(34,211,238,.10), transparent 60%), var(--bg);
  color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:48px 20px 40px; }
.brand { display:flex; align-items:center; gap:12px; font-weight:900; font-size:22px; letter-spacing:-.02em; }
.mark { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(135deg,#22d3ee,#6366f1); box-shadow:0 8px 24px -8px rgba(34,211,238,.55); }
.brand em { font-style:normal; color:var(--cyan); }
h1 { margin:56px 0 0; font-size:clamp(34px,6vw,64px); font-weight:900; letter-spacing:-.03em; text-align:center; line-height:1.05; }
h1 span { display:block; color:var(--cyan); }
.sub { margin:18px auto 0; max-width:640px; text-align:center; color:var(--dim); font-size:clamp(15px,2vw,18px); line-height:1.6; }
.wl { margin:34px auto 0; display:flex; gap:10px; width:min(520px,100%); }
.wl input[type=email] { flex:1; padding:14px 16px; border-radius:13px; border:1px solid var(--line); background:var(--bg2);
  color:var(--ink); font-size:15px; outline:none; }
.wl input[type=email]:focus { border-color:var(--cyan); }
.wl button { padding:14px 22px; border:0; border-radius:13px; background:linear-gradient(135deg,#22d3ee,#0ea5e9);
  color:#04121a; font-weight:800; font-size:15px; cursor:pointer; }
.wl button:disabled { opacity:.6; cursor:default; }
.consent { margin-top:12px; display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--dim); }
.consent input { accent-color:var(--cyan); }
.wlmsg { margin-top:10px; font-size:13.5px; color:var(--dim); text-align:center; min-height:18px; }
.wlmsg.ok { color:#34d399; }
.note { margin-top:8px; font-size:12.5px; color:var(--dim); opacity:.85; text-align:center; }
.suite { margin:64px auto 0; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; width:min(880px,100%); }
.tile { position:relative; height:150px; border-radius:18px; border:1px solid var(--line); background:linear-gradient(160deg,#151c2c,#0d1220);
  display:grid; place-items:center; overflow:hidden; }
.tile::before { content:""; position:absolute; inset:0; backdrop-filter:blur(7px); background:rgba(10,14,22,.45); }
.tname { position:relative; font-weight:900; font-size:18px; letter-spacing:.02em; opacity:.55; }
.tsoon { position:absolute; bottom:14px; right:16px; font-size:12px; color:var(--cyan); opacity:.9; }
footer { margin-top:64px; display:flex; gap:22px; font-size:13px; color:var(--dim); flex-wrap:wrap; justify-content:center; }
footer a { color:var(--dim); text-decoration:none; }
footer a:hover { color:var(--cyan); }
@media (max-width:560px) { .wl { flex-direction:column; } }
</style>
</head>
<body>
<div class="brand"><span class="mark">✦</span>pum<em>FORGE</em></div>
<h1>Your AI. Your machine.<span>Coming soon.</span></h1>
<p class="sub">Not a chatbot. A co-worker. Forgey arrives in weeks.</p>
<form class="wl" id="wlForm">
  <input type="email" id="wlEmail" placeholder="you@example.com" aria-label="Email address" required>
  <button type="submit" id="wlBtn">Join the waitlist</button>
</form>
<label class="consent"><input type="checkbox" id="wlConsent"> Email me launch updates — no spam, unsubscribe anytime.</label>
<div class="wlmsg" id="wlMsg"></div>
<div class="note">Launch window announced soon — founding members get first seats.</div>
<div class="suite"><div class="tile"><span class="tname">pumOFFICE</span><span class="tsoon">coming soon…</span></div><div class="tile"><span class="tname">pumMAIL</span><span class="tsoon">coming soon…</span></div><div class="tile"><span class="tname">pumCLOUD</span><span class="tsoon">coming soon…</span></div></div>
<footer>
  <a href="https://pumoffice.com/about.html">Story</a>
  <a href="https://pumoffice.com/privacy.html">Privacy</a>
  <a href="https://pumoffice.com/login">Member sign-in</a>
  <span>© pum</span>
</footer>
<script>
(function () {
  var f = document.getElementById('wlForm'), e = document.getElementById('wlEmail'),
      c = document.getElementById('wlConsent'), b = document.getElementById('wlBtn'),
      m = document.getElementById('wlMsg');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = (e.value || '').trim();
    if (!email) return;
    if (!c.checked) { m.className = 'wlmsg'; m.textContent = 'Please tick the box so we may email you.'; return; }
    b.disabled = true; m.className = 'wlmsg'; m.textContent = 'Joining…';
    fetch('https://pumoffice.com/api/waitlist/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, consent: true, source: 'pumforge.com' })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        var j = res.j || {};
        if (res.ok && j.ok && j.on_list) {
          m.className = 'wlmsg ok';
          m.textContent = "You're on the list — #" + j.count + ' in line. We will email you when seats open.';
          e.value = ''; c.checked = false;
        } else if (res.ok && j.ok && j.pending_confirm) {
          m.className = 'wlmsg ok';
          m.textContent = 'Almost there — check your inbox to confirm your spot.';
          e.value = ''; c.checked = false;
        } else {
          m.textContent = j.error || j.detail || 'Something went wrong — try again.';
        }
      }).catch(function () { m.textContent = 'Network error — try again.'; })
      .finally(function () { b.disabled = false; });
  });
})();
</script>
</body>
</html>
